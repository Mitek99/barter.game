version = 0.1

# Deploy target for the barter.game banks. Credentials come from the AWS
# profile, not from here: AWS_PROFILE=app-deployer ./deploy.sh
[default.deploy.parameters]
stack_name = "barter-banks"
region = "us-west-2"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
# The app-deployer user's IAM policy refuses role creation without this
# permissions boundary (deployer-template.yaml). BankAdmins: operator pubkey(s)
# allowed on /ui/admin/* (see README "admin access"). DomainName serves the
# site and the banks on docs.barter.game (bare domain only, no www); the cert
# is the docs.barter.game one in us-east-1. AltDomain='' is explicit: sam
# deploy reuses the previous stack value for any parameter omitted here, so
# dropping the key would silently keep barter.games aliased.
parameter_overrides = "RolePermissionsBoundary=AppDeployerBoundary BankAdmins=D3Gh4oyipxyxkHfAVUFfwx9qAZkieH7C4Tc3RtsiMA6z DomainName=docs.barter.game AltDomain='' AcmCertificateArn=arn:aws:acm:us-east-1:164620743841:certificate/4150f74a-4684-4b51-9852-b9782a4b74ed"
