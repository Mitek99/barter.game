baseURL = 'https://docs.barter.game'
languageCode = 'en-us'
title = 'barter.game'

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github'

[params]
  description = 'A federated mutual-credit ledger. Be your own bank.'
  [params.editURL]
    enable = true
    base = 'https://github.com/Mitek99/barter.game/edit/main/website/content/'

  [params.navbar]
    displayTitle = true
    displayLogo = true
    # The barter.game mark, same artwork as the favicon and the web app icon.
    # It carries its own accent background, so the light and dark navbar share
    # one file (no logo.dark override needed).
    [params.navbar.logo]
      path = 'images/logo.svg'
      link = 'https://barter.game'
      width = 24
      height = 24

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.search]
    enable = true
    type = 'flexsearch'

[menu]
  [[menu.main]]
    name = 'Docs Home'
    pageRef = '/'
    weight = 1
  [[menu.main]]
    name = 'Search'
    weight = 2
    [menu.main.params]
      type = 'search'
